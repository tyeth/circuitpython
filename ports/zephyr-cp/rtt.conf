# Zephyr console + log backend on SEGGER RTT instead of UART0 (make RTT=1).
#
# Read it over SWD with OpenOCD, no UART wiring needed, e.g. on a Pico 2 W:
#   openocd -f interface/cmsis-dap.cfg -c "adapter serial <probe>" -f target/rp2350.cfg \
#     -c init -c 'rtt setup 0x20000000 0x82000 "SEGGER RTT"' -c 'rtt start' \
#     -c 'rtt server start 9090 0'      # then read TCP 9090
# (RP2040: target/rp2040.cfg and a 0x42000 search size.)
# RTT reads are plain memory polls, so unlike a halt they do not take USB CDC down.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
# Never block the logger when no host is reading the up-buffer.
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
