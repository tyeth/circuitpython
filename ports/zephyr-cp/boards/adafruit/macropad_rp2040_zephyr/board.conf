CONFIG_GPIO=y

# Package pin map for the RP2040 QFN-56 used by this board.
CONFIG_IOBROKER_PACKAGE_RP2040_QFN56=y

# Enable the SH1106 OLED via the Zephyr display subsystem
CONFIG_DISPLAY=y

# No Zephyr UART console (see board.overlay), so SCL/SDA are free for I2C.
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
