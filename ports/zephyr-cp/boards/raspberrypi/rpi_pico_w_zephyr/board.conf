CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y

# TCP. Nothing in the port or the SoC defaults turns it on, so until now every
# SOCK_STREAM socket on these boards failed inside net_context_get() with
# EPROTOTYPE -- surfaced by socketpool as "Out of sockets" -- which also means
# the web workflow's listener never opened. HTTP(S) clients and servers need it.
CONFIG_NET_TCP=y

CONFIG_WIFI=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_LEGACY_CRYPTO=n
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME="circuitpython"

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256=y
CONFIG_MBEDTLS_ENTROPY_C=y
CONFIG_MBEDTLS_CTR_DRBG_C=y

# The collector's captive portal serves HTTPS from a PEM certificate chain
# (fullchain.pem / key.pem via ssl.SSLContext.load_cert_chain); mbedTLS only
# parses DER unless PEM decoding is compiled in.
CONFIG_MBEDTLS_PEM_PARSE_C=y

# TLS 1.2 ECDHE. Zephyr's mbedTLS 4 default serves secp256r1 through the p256-m
# PSA driver and leaves the builtin ECP module out. mbedTLS then defines a dummy
# MBEDTLS_ECP_MAX_BITS of 1, and ssl.h sizes the TLS 1.2 premaster buffer
# (union mbedtls_ssl_premaster_secret._pms_ecdh[MBEDTLS_ECP_MAX_BYTES]) from
# it, so every ECDHE key agreement fails with PSA_ERROR_BUFFER_TOO_SMALL -- a
# 1-byte buffer for a 32-byte shared secret -- and surfaces as OSError 138 on
# the first read of any TLS connection, client or server. Keep the builtin
# ECP module (p256-m off) until the header sizes that buffer from PSA.
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n

# File descriptors. Zephyr sizes the fd table from the subsystems' declared
# needs (ZVFS_OPEN_ADD_SIZE_*), which came to 4 here; the DHCPv4 server takes
# one socket plus the socket-service eventfd, leaving a program two, and
# socketpool.socket() then fails with "Out of sockets" at the first TLS
# listener. Give sockets a real ceiling (each fd entry is ~12 bytes).
CONFIG_ZVFS_OPEN_MAX=16

# SoftAP. wifi.radio.start_ap() drives the AIROC driver's ap_enable through
# wifi_mgmt (the driver already implements it; this only enables the pieces
# around it). The DHCPv4 server hands joining stations addresses from a pool
# just above the AP's own -- 192.168.4.1 by default, as on ESP32 -- and tells
# them the AP is their DNS server and (RFC 8910 option 114) captive portal, so
# a portal served from CircuitPython is found by phones and laptops without
# the user typing an address.
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=8
CONFIG_NET_DHCPV4_SERVER_OPTION_DNS_ADDRESS="192.168.4.1"
CONFIG_NET_DHCPV4_SERVER_OPTION_CAPTIVE_PORTAL=y

CONFIG_TEST_RANDOM_GENERATOR=y

# Bluetooth over the shared gSPI bus (CONFIG_BT itself comes from the
# zephyr,bt-hci chosen node in the overlay).
#
# The CYW43439's BT controller firmware does not implement the Bluetooth 5
# extended advertising/scanning commands, and the port defaults BT_EXT_ADV on,
# so turn it off here and let the host use the legacy 0x200B/0x200C commands.
CONFIG_BT_EXT_ADV=n
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
