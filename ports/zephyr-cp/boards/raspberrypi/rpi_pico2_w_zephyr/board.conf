CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y

CONFIG_WIFI=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_LEGACY_CRYPTO=n
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME="circuitpython"

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256=y
CONFIG_MBEDTLS_ENTROPY_C=y
CONFIG_MBEDTLS_CTR_DRBG_C=y

# Bluetooth over the shared gSPI bus (CONFIG_BT itself comes from the
# zephyr,bt-hci chosen node in the overlay).
#
# The WHD WiFi, cybt BT and coexistence call chains are deeper than the
# defaults in ../prj.conf; the Cortex-M33 MPU catches an overflow cleanly
# instead of silently corrupting neighbouring stacks.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# The CYW43439's BT controller firmware (CYW4343A2_001.003.016.0065.0000) does
# not implement the Bluetooth 5 extended advertising/scanning commands: it
# rejects LE Set Extended Scan Parameters (0x2041) with status 0x01 "Unknown
# HCI Command", so scanning fails with -EIO. The port defaults BT_EXT_ADV on,
# so turn it off here to make the host use the legacy 0x200B/0x200C scan and
# legacy advertising commands instead.
CONFIG_BT_EXT_ADV=n
