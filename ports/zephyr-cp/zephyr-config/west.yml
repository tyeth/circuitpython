manifest:
  group-filter:
    - +babblesim
  projects:
    - name: nrf_hw_models
      url: https://github.com/tannewt/ext_nRF_hw_models
      revision: 41cb69cd08848cc31e91ed62d01d397511981919
      path: modules/bsim_hw_models/nrf_hw_models
    # CI-ONLY OVERRIDES -- do not merge to main.
    #
    # The Pico 2 W Bluetooth work lives in fork branches that are still in
    # review, so point the manifest at them to get a BLE-capable CI artifact.
    # A project declared here overrides the same-named project imported from
    # Zephyr's own manifest.
    #
    #   tyeth/zephyr#1        CYW43 shared-bus HCI driver (+ #2 USB DPRAM fix)
    #   tyeth/hal_rpi_pico#1  cybt ring-index hardening
    #   tyeth/hal_rpi_pico#2  flash helper RAM placement
    #   tyeth/hal_infineon#1  Murata-1YN BT coex NVRAM
    #
    # Revert to these upstream revisions before merging:
    #   zephyr        adafruit/zephyr @ 52dc937c7cda06a1c18ff6adec281bbeb096b3d4
    #   hal_rpi_pico  as imported by Zephyr's own manifest
    #   hal_infineon  as imported by Zephyr's own manifest
    - name: zephyr
      url: https://github.com/tyeth/zephyr
      revision: airoc-softap-fixes
      clone-depth: 100
      import: true
    - name: hal_rpi_pico
      url: https://github.com/tyeth/hal_rpi_pico
      revision: integration-pico2w-ble
      path: modules/hal/rpi_pico
    - name: hal_infineon
      url: https://github.com/tyeth/hal_infineon
      revision: cyw43-shared-bus-ble
      path: modules/hal/infineon
