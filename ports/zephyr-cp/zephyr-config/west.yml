manifest:
  group-filter:
    - +babblesim
    # TF-M and friends, no CircuitPython board builds with them.
    - -tee
  projects:
    - name: nrf_hw_models
      url: https://github.com/tannewt/ext_nRF_hw_models
      revision: 41cb69cd08848cc31e91ed62d01d397511981919
      path: modules/bsim_hw_models/nrf_hw_models
    - name: mcuboot
      url: https://github.com/adafruit/adaboot
      revision: a6f8f35a36f6363b3c24b1b3d89b7f7846983c4e
      path: bootloader/mcuboot
    # CI-ONLY OVERRIDES -- do not merge to main.
    #
    # The Pico 2 W Bluetooth work lives in fork branches that are still in
    # review, so point the manifest at them to get a BLE-capable CI artifact.
    # A project declared here overrides the same-named project imported from
    # Zephyr's own manifest.
    #
    #   tyeth/zephyr#1        CYW43 shared-bus HCI driver (+ #2 USB DPRAM fix)
    #   tyeth/hal_rpi_pico#1  cybt ring-index hardening
    #   tyeth/hal_rpi_pico#2  flash helper RAM placement
    #   tyeth/hal_infineon#1  Murata-1YN BT coex NVRAM
    #
    # Revert to these upstream revisions before merging:
    #   zephyr        adafruit/zephyr @ 3ab36efea64edda80e45ece016753e3686bb763f
    #   hal_rpi_pico  as imported by Zephyr's own manifest
    #   hal_infineon  as imported by Zephyr's own manifest
    - name: zephyr
      url: https://github.com/tyeth-ai-assisted/zephyr
      revision: 5bf4230db7fe1e6b27bd866cf1691ff54ac5099d
      clone-depth: 100
      import:
        # Skip what no CircuitPython board can use, so west update fetches 37
        # projects instead of 80. Boards come from adafruit, nordic, nxp,
        # raspberrypi, renesas, silabs and st; the Pico W's CYW43 is in hal_infineon.
        name-blocklist:
          # HALs of vendors without a board here
          - hal_adi
          - hal_afbr
          - hal_ambiq
          - hal_atmel
          - hal_bouffalolab
          - hal_espressif
          - hal_ethos_u
          - hal_gigadevice
          - hal_intel
          - hal_microchip
          - hal_nuvoton
          - hal_openisa
          - hal_quicklogic
          - hal_realtek
          - hal_sifli
          - hal_tdk
          - hal_telink
          - hal_ti
          - hal_wch
          - hal_wurthelektronik
          - hal_xtensa
          # libraries the port never enables
          - acpica
          - cmsis-dsp
          - cmsis-nn
          - dhara
          - liblc3
          - libmctp
          - libsbc
          - lora-basics-modem
          - loramac-node
          - lvgl
          - mipi-sys-t
          - mldsa-native
          - net-tools
          - openthread
          - percepio
          - uoscore-uedhoc
          - zephyr-xenlib
    - name: hal_rpi_pico
      url: https://github.com/tyeth-ai-assisted/hal_rpi_pico
      revision: de12fc2a0f756d889cc13c129622ddb663025d29
      path: modules/hal/rpi_pico
      submodules:
        - path: lib/cyw43-driver
    - name: hal_infineon
      url: https://github.com/tyeth-ai-assisted/hal_infineon
      revision: 7f93dc60675126a63358ffa0780648d94fd2d634
      path: modules/hal/infineon
